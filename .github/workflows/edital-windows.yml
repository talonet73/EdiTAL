name: EDITAL Installer Windows
on:
  workflow_dispatch:
  push:
    branches: [main, codex/taledit-export-mcp-whisper]
    paths: ['server.ts', 'server/**', 'src/**', 'public/**', 'scripts/**', 'package.json', 'package-lock.json', 'vite.config.ts', 'logo_EdiTAL.png', 'tests/large-import.test.ts', 'packaging/windows/**', '.github/workflows/edital-windows.yml']
permissions:
  contents: read
concurrency:
  group: edital-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Install compiler
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis --yes --no-progress }
      - name: Prepare complete offline payload
        shell: pwsh
        run: python packaging/windows/build.py --payload-only --makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - name: Verify large MOV import and non-MP4 codecs on Windows
        shell: pwsh
        run: |
          $env:PATH = "$pwd\build\windows\payload\tools;" + $env:PATH
          npx tsx --test tests/large-import.test.ts tests/compound-clips.test.ts tests/editing-requests.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows launch and duplicate launch before compression
        run: python packaging/windows/launcher-smoke.py build/windows/payload
      - name: Compress single installer after launcher checks pass
        id: installer_build
        shell: pwsh
        run: python packaging/windows/build.py --installer-only --makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - run: npx playwright install chromium chrome msedge
      - name: Test actual installer and installed application on Windows
        run: python packaging/windows/smoke.py build/windows/EDITAL-Setup.exe build/windows/payload.sha256.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EDITAL-installed-player-tests
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.installer_build.outcome == 'success' }}
        with:
          name: EDITAL-Windows-candidate
          path: |
            build/windows/EDITAL-Setup.exe
            build/windows/EDITAL-Setup.exe.sha256
            build/windows/payload.sha256.json
      - name: Publish only after Windows checks pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "edital-windows-$('${{ github.sha }}'.Substring(0,12))"
          @"
          Installer unico e completo per Windows 10/11 a 64 bit. Include Python, Node.js, FFmpeg, Whisper small e U2NetP; nessuna preparazione manuale.

          Include importazione su disco senza limite applicativo di 500 MB, formati rilevati da FFmpeg e anteprime compatibili senza alterare gli originali. Verificato MOV 4K/60fps sopra 500 MB su Windows. Include anche la correzione AI Cut per FFmpeg recente.

          Scarica EDITAL-Setup.exe, aprilo e segui Installa. L'app si apre nella propria finestra desktop Electron, con logo EdiTAL nell'installer, nei collegamenti e nell'interfaccia. I file personali restano separati dagli aggiornamenti.

          Build verificata su Windows: installazione, runtime inclusi, trascrizione reale e timestamp, rimozione sfondo, avvio, importazione, esportazione video/audio, screenshot PNG, interfaccia, chiusura e disinstallazione con conservazione dei dati.

          Sorgente app: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          Componenti, licenze e riferimenti ai sorgenti: packaging/windows/THIRD-PARTY.md nello stesso commit. Installer privo di firma digitale.
          "@ | Set-Content -Encoding utf8 build/windows/release-notes.md
          gh release create $tag build/windows/EDITAL-Setup.exe build/windows/EDITAL-Setup.exe.sha256 --title "EDITAL Windows $tag" --notes-file build/windows/release-notes.md --target '${{ github.sha }}' --latest
